<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MvC2 True Widescreen Arcade</title>
    <!-- Cross-Origin Worker to unlock Chromebook multi-threading for 60FPS -->
    <script src="https://jsdelivr.net"></script>
</head>
<body style="margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center;">

    <h1 style="margin-top: 15px;">Marvel vs Capcom 2 (True Widescreen)</h1>
    
    <div style="width: 100vw; height: 85vh; max-width: 100%; margin: 0 auto; background: #000;">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'dreamcast'; 
        // Official working library endpoints for EmulatorJS
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // TRUE 16:9 RENDERING: Widens game perspective instead of stretching sprites
        EJS_mouse = false; 
    </script>
    <script src="https://emulatorjs.org"></script>

</body>
</html>
